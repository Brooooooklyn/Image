nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.0.cjs

npmPreapprovedPackages:
  - "@napi-rs/*"
  - tailwindcss
  - "@tailwindcss/*"
  - void
  - "@void/*"

packageExtensions:
  # @void/md@0.20.1 bumped markdown-it-attrs to ^5, which require()s
  # `markdown-it` at runtime — but only declares it as a peer dependency
  # that nothing provides (@void/md itself parses with markdown-exit).
  "@void/md@*":
    dependencies:
      markdown-it: "npm:^15.0.2"

supportedArchitectures:
  cpu:
    - current
    - wasm32
